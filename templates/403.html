{% extends "base.html" %}
{% block title %}Not allowed{% endblock %}
{% block content %}
<div class="container">
  <p class="error-code" aria-hidden="true">4<span>0</span>3</p>
  <section class="intro-row">
    <div>
      <div class="meta"><span>Error 403</span><span class="sep">·</span>Not allowed</div>
      <h1 class="intro-title mt-2">You can't do that here.</h1>
    </div>
    <p class="intro-text">{% if exception %}{{ exception }}{% else %}That action belongs to the other person in this exchange, or to an admin.{% endif %}</p>
    <div class="act"><a href="{% if user.is_authenticated %}{% url 'accounts:dashboard' %}{% else %}{% url 'core:home' %}{% endif %}" class="btn-shadow">Go back ↗</a></div>
  </section>
</div>
{% endblock %}
