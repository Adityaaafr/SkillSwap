{% load static %}<!doctype html>
{# Standalone on purpose: when the server errors, the normal page context may not be available. #}
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · SkillSwap</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px;
           background: #0b0b0b; color: #f2f2f2; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .code { font-family: Impact, "Arial Narrow", sans-serif; font-size: clamp(120px, 28vw, 380px); line-height: .85; margin: 0; }
    .code span { color: #ff6a3d; }
    h1 { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 400; font-size: clamp(22px, 3vw, 32px); margin: 24px 0 8px; }
    p { color: #8a8a8a; max-width: 52ch; line-height: 1.5; }
    a { color: #f2f2f2; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    a::before { content: "[\00a0"; } a::after { content: "\00a0]"; }
  </style>
</head>
<body>
  <p class="code" aria-hidden="true">5<span>0</span>0</p>
  <h1>Something went wrong on our side.</h1>
  <p>It's not you. The error has been logged; try again in a moment.</p>
  <p><a href="/">Back to SkillSwap ↗</a></p>
</body>
</html>
