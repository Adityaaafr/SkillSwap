<span class="status-badge status-{{ status }}">{% if status == "pending" %}<i class="bi bi-hourglass-split"></i>{% elif status == "accepted" or status == "scheduled" %}<i class="bi bi-check2"></i>{% elif status == "completed" %}<i class="bi bi-patch-check"></i>{% else %}<i class="bi bi-x"></i>{% endif %} {{ label }}</span>
