<span class="stars" title="{% if rating %}{{ rating|floatformat:1 }} out of 5{% else %}No ratings yet{% endif %}">{% for i in full %}<i class="bi bi-star-fill"></i>{% endfor %}{% if half %}<i class="bi bi-star-half"></i>{% endif %}{% for i in empty %}<i class="bi bi-star"></i>{% endfor %}</span>{% if count is not None %} <span class="text-muted small">{% if rating %}{{ rating|floatformat:1 }} · {% endif %}{{ count }} review{{ count|pluralize }}</span>{% endif %}
